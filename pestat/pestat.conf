# Configuration defaults (global or per-user) for the pestat command

# Print only jobs of user:
# export username=$USER

# Thresholds for flagging nodes (-f/-F flags)
# export cpuload_delta1=2.0	# CPU load delta from ideal load (RED)
# export cpuload_delta2=0.5	# CPU load delta from ideal load (MAGENTA)
# export memory_thres1=0.1	# Fraction of memory which is free (RED)
# export memory_thres2=0.2	# Fraction of memory which is free (MAGENTA)

# Colored output by default (override by -C/-c flags)
# export colors=1

# Unique nodes only (nodes in multiple partitions are printed once only)
# Override by -U flag.
# export uniquenodes=0

# Select partion (default: all)
# export partition="-p partition1"
# Select nodes (default: all)
# export hostlist="-n node[1-9]"

# Per-node GPU descriptor shown as a column in "pestat -G", next to GRES/used.
# Slurm often reports only a coarse GPU type (e.g. Ampere, which may cover several
# distinct products) or none at all. Define this Bash associative array to display
# the real GPU per node as "arch/model/vram". Keys are node names; values are
# free-form. The column appears only when this map is set.
# declare -A PESTAT_GPU_MODEL=(
# 	[node01]="Ampere/A5000/24G"
# 	[node02]="Ada/L40S/48G"
# )

# Tunables for the -G GPU availability bar and per-job fair-share coloring:
# export gpubar_minmem=1024   # min MB for a free GPU to count as grabbable (else red)
# export gpufair_ok=1.0       # CPU/mem-per-GPU at/under this x the true fair share = green.
#                             # CPU must be fully within fair for green/yellow; over = red.
# export gpunom_gran=16384    # round RealMemory up to this (MB) to infer nominal RAM, so a
#                             # nominal-rounded mem request (e.g. 32GB where fair is 31.2GB)
#                             # is borderline/yellow; memory above the nominal share is red
